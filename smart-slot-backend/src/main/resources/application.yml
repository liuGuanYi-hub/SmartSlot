server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: smart-slot-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/smart_slot?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 15
      idle-timeout: 30000
      pool-name: SmartSlotHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted

jwt:
  # Base64 格式的 256 位安全秘钥 (用于 HMAC-SHA256)
  secret: c21hcnRzbG90LXNlY3JldC1rZXktZm9yLWp3dC1hdXRoZW50aWNhdGlvbi0yMDI2
  expiration: 86400000 # 24小时有效 (毫秒)

# Knife4j API 文档
knife4j:
  enable: true
  openapi:
    title: "SmartSlot 智能场地/时段预约系统 API 文档"
    description: "具备组件化日历时段矩阵、防超卖锁、分页查询、JWT鉴权与限流拦截器的一体化系统"
    version: "v1.0.0"
    contact:
      name: "SmartSlot Dev Team"
